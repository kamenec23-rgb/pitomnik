<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хвойный Питомник</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-1: #E8F5E9;
            --bg-2: #C8E6C9;
            --text-main: #1B3B22;
            --text-soft: #2E7D32;
            --glass: rgba(255, 255, 255, 0.85);
            --accent-1: #2E7D32;
            --accent-2: #81C784;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px;
            padding-top: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: background 0.4s, color 0.4s;
        }

        .profile-card {
            position: fixed; top: 16px; right: 16px; z-index: 1000;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px 6px 6px;
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 50px; box-shadow: 0 4px 16px rgba(46, 125, 50, 0.15);
            cursor: pointer; user-select: none;
        }
        
        .profile-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; font-weight: 800; font-size: 14px;
        }
        .profile-name { font-size: 13px; font-weight: 700; color: var(--text-main); }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 42px; margin-bottom: 12px; font-weight: 800; }
        .gradient-text {
            background: linear-gradient(90deg, var(--accent-1) 0%, #43A047 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-soft); font-size: 15px; font-weight: 500; }

        .carousel { width: 100%; max-width: 420px; margin-bottom: 24px; }
        .carousel-track {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            scrollbar-width: none; border-radius: 24px; box-shadow: 0 8px 28px rgba(27, 59, 34, 0.15);
        }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide {
            flex: 0 0 100%; scroll-snap-align: center;
            height: 220px; overflow: hidden; border-radius: 24px;
        }
        .carousel-placeholder {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            font-size: 80px; background: linear-gradient(135deg, #A5D6A7, #66BB6A);
        }

        .order-cta { width: 100%; max-width: 420px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
        .order-btn {
            width: 100%; padding: 20px;
            background: linear-gradient(90deg, var(--accent-1), #43A047);
            color: #FFFFFF; border: none; border-radius: 20px;
            font-size: 18px; font-weight: 800; font-family: inherit;
            cursor: pointer; box-shadow: 0 10px 30px rgba(46, 125, 50, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .order-btn.secondary {
            background: rgba(255, 255, 255, 0.8); color: var(--accent-1);
            border: 2px solid rgba(46, 125, 50, 0.2); font-size: 16px; padding: 16px;
        }

        .page {
            position: fixed; inset: 0; background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
            z-index: 99999; overflow-y: auto; transform: translateX(100%);
            transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .page.open { transform: translateX(0); }
        
        .page-header {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; gap: 12px; padding: 14px 20px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(46, 125, 50, 0.1);
        }
        .page-back-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--accent-1); color: #FFF; border: none;
            display: flex; align-items: center; justify-content: center;
        }
        .page-title { font-size: 17px; font-weight: 800; color: var(--text-main); flex: 1; }
        .page-body { max-width: 480px; margin: 0 auto; padding: 24px 20px 140px; }

        .category {
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 20px; margin-bottom: 12px; overflow: hidden;
            box-shadow: 0 6px 20px rgba(27, 59, 34, 0.08);
        }
        .category-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; cursor: pointer; }
        .category-emoji { font-size: 32px; line-height: 1; }
        .category-info { flex: 1; }
        .category-name { font-size: 16px; font-weight: 800; color: var(--text-main); }
        .category-meta { font-size: 12px; font-weight: 600; color: var(--text-soft); }
        .category-plus {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--accent-1); color: #FFF; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 800; transition: transform 0.3s;
        }
        .category-plus.open { transform: rotate(45deg); }

        .sorts-list {
            max-height: 0; overflow: hidden; transition: max-height 0.5s ease;
            background: rgba(165, 214, 167, 0.15);
        }
        .sorts-list.open { max-height: 2000px; }

        .sort-row {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px; border-top: 1px solid rgba(46, 125, 50, 0.08);
        }
        .sort-photo {
            width: 54px; height: 54px; border-radius: 12px;
            background: linear-gradient(135deg, #A5D6A7, #66BB6A);
            display: flex; align-items: center; justify-content: center; font-size: 26px;
        }
        .sort-info { flex: 1; text-align: left; }
        .sort-name { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .sort-color { font-size: 12px; font-weight: 600; color: var(--text-soft); }
        .sort-price { font-size: 15px; font-weight: 800; color: var(--accent-1); }

        .sort-controls { display: flex; align-items: center; gap: 6px; }
        .sort-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: var(--accent-1); color: #FFF; font-size: 16px; font-weight: 800;
        }
        .sort-btn.minus { background: rgba(46, 125, 50, 0.15); color: var(--accent-1); }
        .sort-count { min-width: 22px; text-align: center; font-size: 14px; font-weight: 800; color: var(--accent-1); }
        .sort-count.zero { color: #9E9E9E; }

        .sorts-close {
            width: 100%; padding: 12px; border: none;
            background: rgba(46, 125, 50, 0.06); color: var(--accent-1);
            font-size: 13px; font-weight: 700; font-family: inherit;
        }

        .float-panel {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(140px);
            width: calc(100% - 40px); max-width: 440px;
            background: linear-gradient(135deg, var(--accent-1) 0%, #43A047 100%);
            border-radius: 20px; padding: 14px 16px;
            box-shadow: 0 14px 40px rgba(46, 125, 50, 0.4);
            display: flex; align-items: center; gap: 12px;
            z-index: 100002; transition: transform 0.4s ease;
            pointer-events: none;
        }
        .float-panel.show { transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .float-info { flex: 1; color: #FFF; text-align: left; }
        .float-count { font-size: 12px; font-weight: 600; opacity: 0.9; }
        .float-total { font-size: 18px; font-weight: 800; }
        .float-btn { padding: 12px 18px; border-radius: 14px; border: none; font-size: 14px; font-weight: 800; }
        .float-btn.cart { background: rgba(255,255,255,0.25); color: #FFF; }
        .float-btn.checkout { background: #FFF; color: var(--accent-1); }

        .cart-modal-overlay {
            position: fixed; inset: 0; background: rgba(27, 59, 34, 0.6);
            backdrop-filter: blur(8px); z-index: 100003;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.3s;
        }
        .cart-modal-overlay.open { opacity: 1; visibility: visible; }
        .cart-modal {
            background: #F1F8E9; border-radius: 28px; padding: 22px;
            max-width: 400px; width: 100%; transform: translateY(20px); transition: transform 0.3s;
        }
        .cart-modal-overlay.open .cart-modal { transform: translateY(0); }
        .cart-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 16px; }
        .cart-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: #FFF; border-radius: 14px; margin-bottom: 8px; }
        .cart-item-emoji { font-size: 24px; }
        .cart-item-info { flex: 1; text-align: left; }
        .cart-item-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .cart-item-meta { font-size: 11px; color: var(--text-soft); }
        .cart-item-remove { background: none; border: none; color: #E53935; font-size: 16px; }
        .cart-total { display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px dashed rgba(46, 125, 50, 0.2); }
        .cart-total-label { font-size: 14px; font-weight: 700; color: var(--text-soft); }
        .cart-total-value { font-size: 22px; font-weight: 800; color: var(--accent-1); }
        .cart-btn { width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 15px; font-weight: 800; margin-top: 8px; }
        .cart-btn.primary { background: var(--accent-1); color: #FFF; }
        .cart-btn.secondary { background: rgba(46, 125, 50, 0.1); color: var(--accent-1); }

        @media (max-width: 600px) {
            .header h1 { font-size: 34px; }
            .profile-name { display: none; }
        }
    </style>
</head>
<body>

    <div class="profile-card" id="profileCard">
        <div class="profile-avatar" id="cornerAvatar">👤</div>
        <span class="profile-name" id="cornerName">Гость</span>
    </div>

    <div class="header">
        <h1>🌲 <span class="gradient-text">Хвойный Питомник</span></h1>
        <p>Саженцы туй, можжевельников и кипарисовиков</p>
    </div>

    <div class="carousel">
        <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide"><div class="carousel-placeholder">🌲</div></div>
            <div class="carousel-slide"><div class="carousel-placeholder">🌿</div></div>
            <div class="carousel-slide"><div class="carousel-placeholder">🌳</div></div>
        </div>
    </div>

    <div class="order-cta">
        <button class="order-btn" id="orderBtn">
            <i class="fas fa-leaf"></i> Перейти в каталог
        </button>
        <button class="order-btn secondary" id="wholesaleBtn">
            <i class="fas fa-truck"></i> Оптовые поставки
        </button>
    </div>

    <!-- КАТАЛОГ -->
    <div class="page" id="catalogPage">
        <div class="page-header">
            <button class="page-back-btn" id="catalogBack"><i class="fas fa-arrow-left"></i></button>
            <div class="page-title">Каталог растений</div>
        </div>
        <div class="page-body">
            <div style="font-size: 13px; color: var(--text-soft); text-align: center; margin-bottom: 20px;">
                Выберите вид растения, чтобы увидеть доступные сорта и высоты
            </div>
            <div id="categoriesList"></div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div class="page" id="profilePage">
        <div class="page-header">
            <button class="page-back-btn" id="profileBack"><i class="fas fa-arrow-left"></i></button>
            <div class="page-title">Мой профиль</div>
        </div>
        <div class="page-body" style="text-align: center;">
            <div style="width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 36px; font-weight: 800; margin: 0 auto 16px;" id="pageAvatar">👤</div>
            <div style="font-size: 22px; font-weight: 800; margin-bottom: 4px;" id="pageName">Гость</div>
            <div style="font-size: 14px; font-weight: 600; color: var(--text-soft); margin-bottom: 24px;" id="pageUsername">@—</div>
            
            <button class="profile-action-btn" id="btnTelegram" style="width: 100%; padding: 14px; margin-bottom: 10px; background: var(--accent-1); color: #FFF; border: none; border-radius: 16px; font-size: 15px; font-weight: 700;">
                <i class="fab fa-telegram"></i> Написать менеджеру
            </button>
        </div>
    </div>

    <!-- Плавающая корзина -->
    <div class="float-panel" id="floatPanel">
        <div class="float-info">
            <div class="float-count" id="floatCount">0 саженцев</div>
            <div class="float-total" id="floatTotal">0.00 BYN</div>
        </div>
        <button class="float-btn cart" id="floatCartBtn">Корзина</button>
        <button class="float-btn checkout" id="floatCheckoutBtn">Оформить</button>
    </div>

    <!-- Модалка корзины -->
    <div class="cart-modal-overlay" id="cartModal">
        <div class="cart-modal">
            <div class="cart-title"><i class="fas fa-shopping-basket" style="color: var(--accent-1);"></i> Корзина</div>
            <div id="cartItems"></div>
            <div class="cart-total">
                <div class="cart-total-label">Итого:</div>
                <div class="cart-total-value" id="cartTotal">0.00 BYN</div>
            </div>
            <button class="cart-btn primary" id="cartCheckoutBtn">Оформить заказ</button>
            <button class="cart-btn secondary" id="cartCloseBtn">Продолжить выбор</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

        const CATEGORIES = [
            {
                id: 'thuja',
                name: 'Туи',
                emoji: '🌲',
                sorts: [
                    { id: 'thuja_smaragd_1', name: 'Смарагд', color: 'Высота 1.0 - 1.5 м', price: 25.0, emoji: '🌲' },
                    { id: 'thuja_smaragd_2', name: 'Смарагд', color: 'Высота 1.5 - 2.0 м', price: 40.0, emoji: '🌲' },
                    { id: 'thuja_smaragd_3', name: 'Смарагд', color: 'Высота 2.0 - 2.5 м', price: 65.0, emoji: '🌲' },
                    { id: 'thuja_stolwijk_1', name: 'Столвик', color: 'Высота 1.0 - 1.5 м', price: 22.0, emoji: '🌲' },
                    { id: 'thuja_stolwijk_2', name: 'Столвик', color: 'Высота 1.5 - 2.0 м', price: 35.0, emoji: '🌲' }
                ]
            },
            {
                id: 'cypress',
                name: 'Кипарисовики',
                emoji: '🌿',
                sorts: [
                    { id: 'cyp_lawson_1', name: 'Лавсона', color: 'Высота 0.5 - 1.0 м', price: 20.0, emoji: '🌿' },
                    { id: 'cyp_lawson_2', name: 'Лавсона', color: 'Высота 1.0 - 1.5 м', price: 30.0, emoji: '🌿' },
                    { id: 'cyp_ellwoodii', name: 'Элвуди', color: 'Высота 0.3 - 0.5 м', price: 15.0, emoji: '🌿' }
                ]
            },
            {
                id: 'juniper',
                name: 'Можжевельники',
                emoji: '🌳',
                sorts: [
                    { id: 'jun_blue_1', name: 'Блю Эрроу', color: 'Высота 1.0 - 1.5 м', price: 18.0, emoji: '🌳' },
                    { id: 'jun_blue_2', name: 'Блю Эрроу', color: 'Высота 1.5 - 2.0 м', price: 28.0, emoji: '🌳' },
                    { id: 'jun_pfit', name: 'Пфитцериана', color: 'Высота 0.3 - 0.5 м', price: 12.0, emoji: '🌳' }
                ]
            }
        ];

        let cart = {};
        
        const catalogPage = document.getElementById('catalogPage');
        const profilePage = document.getElementById('profilePage');
        const categoriesList = document.getElementById('categoriesList');
        const floatPanel = document.getElementById('floatPanel');
        const cartModal = document.getElementById('cartModal');
        const cartItems = document.getElementById('cartItems');
        const cartTotal = document.getElementById('cartTotal');
        const floatCount = document.getElementById('floatCount');
        const floatTotal = document.getElementById('floatTotal');

        function findSort(sortId) {
            for (const cat of CATEGORIES) {
                const s = cat.sorts.find(x => x.id === sortId);
                if (s) return { sort: s, category: cat };
            }
            return null;
        }

        function renderCatalog() {
            categoriesList.innerHTML = '';
            CATEGORIES.forEach(cat => {
                const catEl = document.createElement('div');
                catEl.className = 'category';
                catEl.innerHTML = `
                    <div class="category-head" data-toggle-cat="${cat.id}">
                        <div class="category-emoji">${cat.emoji}</div>
                        <div class="category-info">
                            <div class="category-name">${cat.name}</div>
                            <div class="category-meta">${cat.sorts.length} вариантов</div>
                        </div>
                        <button class="category-plus" data-toggle-cat="${cat.id}"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="sorts-list" id="sorts_${cat.id}">
                        ${cat.sorts.map(sort => {
                            const cnt = cart[sort.id] || 0;
                            return `
                                <div class="sort-row">
                                    <div class="sort-photo">${sort.emoji}</div>
                                    <div class="sort-info">
                                        <div class="sort-name">${sort.name}</div>
                                        <div class="sort-color">${sort.color}</div>
                                    </div>
                                    <div class="sort-price">${sort.price.toFixed(2)}<small> BYN</small></div>
                                    <div class="sort-controls">
                                        <button class="sort-btn minus" data-sort-minus="${sort.id}">−</button>
                                        <span class="sort-count${cnt === 0 ? ' zero' : ''}" id="cnt_${sort.id}">${cnt}</span>
                                        <button class="sort-btn" data-sort-plus="${sort.id}">+</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        <button class="sorts-close" data-close-cat="${cat.id}"><i class="fas fa-chevron-up"></i> Закрыть</button>
                    </div>
                `;
                categoriesList.appendChild(catEl);
            });
        }

        categoriesList.addEventListener('click', (e) => {
            const toggle = e.target.closest('[data-toggle-cat]');
            if (toggle) {
                const catId = toggle.dataset.toggleCat;
                const sortsList = document.getElementById('sorts_' + catId);
                const plusBtn = document.querySelector(`.category-plus[data-toggle-cat="${catId}"]`);
                if (sortsList.classList.contains('open')) {
                    sortsList.classList.remove('open');
                    plusBtn.classList.remove('open');
                } else {
                    sortsList.classList.add('open');
                    plusBtn.classList.add('open');
                }
                return;
            }

            const closeBtn = e.target.closest('[data-close-cat]');
            if (closeBtn) {
                const catId = closeBtn.dataset.closeCat;
                document.getElementById('sorts_' + catId).classList.remove('open');
                document.querySelector(`.category-plus[data-toggle-cat="${catId}"]`).classList.remove('open');
                return;
            }

            const plus = e.target.closest('[data-sort-plus]');
            if (plus) {
                const id = plus.dataset.sortPlus;
                cart[id] = (cart[id] || 0) + 1;
                document.getElementById('cnt_' + id).textContent = cart[id];
                document.getElementById('cnt_' + id).classList.remove('zero');
                updateFloat();
                return;
            }

            const minus = e.target.closest('[data-sort-minus]');
            if (minus) {
                const id = minus.dataset.sortMinus;
                if (cart[id]) {
                    cart[id]--;
                    if (cart[id] === 0) {
                        document.getElementById('cnt_' + id).classList.add('zero');
                    }
                    document.getElementById('cnt_' + id).textContent = cart[id];
                    updateFloat();
                }
                return;
            }
        });

        function updateFloat() {
            let count = 0;
            let total = 0;
            for (const [id, cnt] of Object.entries(cart)) {
                if (cnt > 0) {
                    const found = findSort(id);
                    if (found) {
                        count += cnt;
                        total += found.sort.price * cnt;
                    }
                }
            }
            floatCount.textContent = count + ' саженцев';
            floatTotal.textContent = total.toFixed(2) + ' BYN';
            
            if (count > 0) floatPanel.classList.add('show');
            else floatPanel.classList.remove('show');
        }

        function renderCart() {
            cartItems.innerHTML = '';
            let total = 0;
            let hasItems = false;

            for (const [id, cnt] of Object.entries(cart)) {
                if (cnt > 0) {
                    const found = findSort(id);
                    if (found) {
                        hasItems = true;
                        total += found.sort.price * cnt;
                        cartItems.innerHTML += `
                            <div class="cart-item">
                                <div class="cart-item-emoji">${found.sort.emoji}</div>
                                <div class="cart-item-info">
                                    <div class="cart-item-name">${found.sort.name}</div>
                                    <div class="cart-item-meta">${found.sort.color} × ${cnt}</div>
                                </div>
                                <div style="font-weight: 800; color: var(--accent-1);">${(found.sort.price * cnt).toFixed(2)}</div>
                            </div>
                        `;
                    }
                }
            }

            if (!hasItems) {
                cartItems.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Корзина пуста</div>';
            }
            cartTotal.textContent = total.toFixed(2) + ' BYN';
        }

        // Навигация
        document.getElementById('orderBtn').onclick = () => {
            renderCatalog();
            catalogPage.classList.add('open');
        };
        document.getElementById('catalogBack').onclick = () => catalogPage.classList.remove('open');
        
        document.getElementById('profileCard').onclick = () => {
            profilePage.classList.add('open');
        };
        document.getElementById('profileBack').onclick = () => profilePage.classList.remove('open');

        document.getElementById('wholesaleBtn').onclick = () => {
            alert('Оптовые поставки: свяжитесь с нами по телефону +375 (XX) XXX-XX-XX');
        };

        document.getElementById('floatCartBtn').onclick = () => {
            renderCart();
            cartModal.classList.add('open');
        };
        document.getElementById('floatCheckoutBtn').onclick = () => {
            const total = cartTotal.textContent;
            alert('Заказ на сумму ' + total + ' отправлен менеджеру! (Демо-режим)');
        };
        document.getElementById('cartCloseBtn').onclick = () => cartModal.classList.remove('open');
        document.getElementById('cartCheckoutBtn').onclick = () => {
            alert('Заказ оформлен! (Демо-режим)');
            cartModal.classList.remove('open');
        };
    </script>
</body>
</html>
